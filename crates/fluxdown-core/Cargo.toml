[package]
name = "fluxdown-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 作者: long
# 移动端交叉编译时 host 上没有目标平台 OpenSSL，启用 ssh2 的 vendored OpenSSL
# 从源码构建；桌面构建保持默认（依赖各平台 host OpenSSL），本地开发无需 perl。
vendored-openssl = ["ssh2/vendored-openssl"]

[dependencies]
aes.workspace = true
anyhow.workspace = true
cbc.workspace = true
futures-util.workspace = true
librqbit.workspace = true
librqbit-bencode.workspace = true
m3u8-rs.workspace = true
open.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smb2.workspace = true
ssh2.workspace = true
suppaftp.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "sync", "time"] }
url.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
