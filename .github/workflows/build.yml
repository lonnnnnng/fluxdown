name: Build
run-name: ${{ inputs.run_mode == 'release' && format('手动发版 {0}', github.ref_name) || format('手动打包 {0}', github.ref_name) }}

on:
  # long: 构建和发布资源成本较高，只在明确发版或打包时手动启动，避免普通提交或 tag 推送重复触发。
  workflow_dispatch:
    inputs:
      run_mode:
        description: "只在明确需要打包或发版时选择；普通代码推送不要运行"
        required: true
        type: choice
        default: package
        options:
          - package
          - release

concurrency:
  # long: 同一个 ref 上误点多次手动打包或发版时，只保留最后一次运行，避免 Actions 页面继续出现重复执行记录。
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Check manual build intent
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual build mode
        shell: bash
        run: |
          case "${{ inputs.run_mode }}" in
            package|release) ;;
            *)
              echo "run_mode must be package or release."
              exit 1
              ;;
          esac

          # long: 发版必须绑定 v* 标签，避免在 main 上误点发版后消耗整套多平台构建资源。
          if [ "${{ inputs.run_mode }}" = "release" ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Release mode must run on a v* tag ref. Current ref: $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify manual policy and public asset regression tests
        run: npm run verify:ci-config

  rust:
    name: Rust core and CLI (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: fluxdown-cli-linux
            binary-name: fluxdown
            staged-name: fluxdown
          - os: windows-latest
            artifact-name: fluxdown-cli-windows
            binary-name: fluxdown.exe
            staged-name: fluxdown.exe
          - os: macos-latest
            artifact-name: fluxdown-cli-macos
            binary-name: fluxdown
            staged-name: fluxdown
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Rust core and CLI
        run: cargo test -p fluxdown-core -p fluxdown-cli
      - name: Build CLI
        run: cargo build -p fluxdown-cli --release
      - name: Sign Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          node scripts/sign-windows-artifacts.mjs "target/release/fluxdown.exe"
      - name: Stage CLI artifact
        shell: bash
        run: |
          mkdir -p dist/cli
          cp "target/release/${{ matrix.binary-name }}" "dist/cli/${{ matrix.staged-name }}"
      - name: Verify CLI artifact
        run: node scripts/verify-artifacts.mjs file "dist/cli/${{ matrix.staged-name }}"
      - name: Run Release CLI download smoke
        run: node scripts/verify-release-cli-smoke.mjs "dist/cli/${{ matrix.staged-name }}" "dist/cli-smoke/report.json"
      - name: Upload Release CLI smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-smoke
          path: dist/cli-smoke/report.json
          if-no-files-found: warn
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/cli/${{ matrix.staged-name }}

  desktop:
    name: Desktop GUI (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: fluxdown-desktop-linux
            artifact-path: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/fluxdown-desktop
          - os: windows-latest
            artifact-name: fluxdown-desktop-windows
            artifact-path: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/fluxdown-desktop.exe
          - os: macos-latest
            artifact-name: fluxdown-desktop-macos
            artifact-path: |
              target/release/bundle/macos/FluxDown.app
              target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - name: Install Node dependencies
        run: npm ci
      - name: Build Linux desktop app
        if: runner.os == 'Linux'
        run: npm run desktop:build
        env:
          TAURI_BUNDLES: deb,rpm
      - name: Build desktop app
        if: runner.os != 'Linux'
        run: npm run desktop:build
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: npm run desktop:dmg
      - name: Sign Windows desktop artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          node scripts/sign-windows-artifacts.mjs `
            "target/release/fluxdown-desktop.exe" `
            "target/release/bundle/nsis/*.exe" `
            "target/release/bundle/msi/*.msi"
      - name: Verify Linux desktop artifact
        if: runner.os == 'Linux'
        run: node scripts/verify-artifacts.mjs linux-gui-ci
      - name: Verify Windows desktop artifact
        if: runner.os == 'Windows'
        run: node scripts/verify-artifacts.mjs desktop-windows-ci
      - name: Verify macOS desktop artifacts
        if: runner.os == 'macOS'
        run: node scripts/verify-artifacts.mjs desktop-macos
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  android:
    name: Android app
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust FFI library for Android
        shell: bash
        run: |
          # 作者: long
          # 把 Rust 下载核心（fluxdown-ffi）编成三个主流 ABI 的动态库并放进
          # jniLibs，Flutter 打包时自动带进 APK；协议识别经 dart:ffi 走 FFI 优先。
          # runner 预设变量不在 env context 里，直接在 shell 里取。
          ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$ANDROID_NDK_HOME" ]; then
            echo "ANDROID_NDK_LATEST_HOME is not set; cannot build fluxdown_ffi."
            exit 1
          fi
          cargo ndk \
            --target arm64-v8a \
            --target armeabi-v7a \
            --target x86_64 \
            --platform 24 \
            -o apps/mobile/android/app/src/main/jniLibs \
            build --release -p fluxdown-ffi --features fluxdown-core/vendored-openssl
          node scripts/verify-artifacts.mjs file \
            apps/mobile/android/app/src/main/jniLibs/arm64-v8a/libfluxdown_ffi.so
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze
      - name: Build host FFI for binding tests
        run: cargo build --locked -p fluxdown-ffi
      - name: Test mobile app
        working-directory: apps/mobile
        run: flutter test --dart-define=FLUXDOWN_FFI_TEST_LIBRARY=${{ github.workspace }}/target/debug/libfluxdown_ffi.so
      - name: Configure Android release signing
        working-directory: apps/mobile/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; release builds will use debug signing for install testing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=upload-keystore.jks" \
            > key.properties
      - name: Build Android APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Build Android release APK
        working-directory: apps/mobile
        run: flutter build apk --release --split-debug-info=build/symbols/android
      - name: Build Android App Bundle
        working-directory: apps/mobile
        run: flutter build appbundle --release --split-debug-info=build/symbols/android
      - name: Preserve Android symbols and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-android-symbols
          path: |
            apps/mobile/build/symbols/android
            apps/mobile/build/app/outputs/mapping/release
          if-no-files-found: error
      - name: Verify Android release artifacts
        run: node scripts/verify-artifacts.mjs android
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-android-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-android-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-android-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS app
    needs: preflight
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust FFI static library for iOS
        run: |
          # 作者: long
          # 与 Runner 共用构建脚本，统一 Rust/C 的部署版本；模拟器库由 Runner 按架构构建。
          bash scripts/build-ios-ffi.sh
          mkdir -p dist/ffi-ios
          cp target/ffi-ios/iphoneos/libfluxdown_ffi.a dist/ffi-ios/
          node scripts/verify-artifacts.mjs file dist/ffi-ios/libfluxdown_ffi.a
      - name: Upload Rust FFI static library
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-ffi-ios-static
          path: dist/ffi-ios/libfluxdown_ffi.a
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check iOS signing secrets
        id: ios_secrets
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$IOS_KEYCHAIN_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets are not set; building unsigned iOS artifacts only."
          fi
      - name: Configure iOS release signing
        id: ios_signing
        working-directory: apps/mobile
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ steps.ios_secrets.outputs.enabled }}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "iOS release signing secrets are not set; skipping signed IPA build."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/fluxdown-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-profile.plist"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[ "]//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")
          if [ "$APP_IDENTIFIER" != "$APPLE_TEAM_ID.dev.fluxdown.mobile" ]; then
            echo "Provisioning profile application identifier '$APP_IDENTIFIER' does not match '$APPLE_TEAM_ID.dev.fluxdown.mobile'."
            exit 1
          fi
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          /usr/libexec/PlistBuddy -c 'Clear dict' ios/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c 'Add :method string app-store' ios/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' ios/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' ios/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:dev.fluxdown.mobile string $PROFILE_NAME" ios/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' ios/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' ios/ExportOptions.ci.plist
          plutil -lint ios/ExportOptions.ci.plist

          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build iOS debug frameworks
        if: steps.ios_signing.outputs.enabled == 'true'
        working-directory: apps/mobile
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: flutter build ios-framework --no-profile --no-release
      - name: Verify iOS debug frameworks
        if: steps.ios_signing.outputs.enabled == 'true'
        run: node scripts/verify-artifacts.mjs ios-framework
      - name: Upload iOS debug frameworks
        if: steps.ios_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-ios-debug-frameworks
          path: apps/mobile/build/ios/framework/Debug
      - name: Build iOS simulator app
        working-directory: apps/mobile
        run: flutter build ios --simulator
      - name: Verify iOS simulator app
        run: node scripts/verify-artifacts.mjs ios-simulator
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-ios-simulator
          path: apps/mobile/build/ios/iphonesimulator/Runner.app
      - name: Build unsigned iOS device app
        working-directory: apps/mobile
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: flutter build ios --no-codesign --split-debug-info=build/symbols/ios
      - name: Verify unsigned iOS device app
        run: node scripts/verify-artifacts.mjs ios-device-unsigned
      - name: Upload unsigned iOS device app
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-ios-device-unsigned
          path: apps/mobile/build/ios/iphoneos/Runner.app
      - name: Build signed iOS IPA
        if: steps.ios_signing.outputs.enabled == 'true'
        working-directory: apps/mobile
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: flutter build ipa --split-debug-info=build/symbols/ios --export-options-plist=ios/ExportOptions.ci.plist
      - name: Verify signed iOS IPA
        if: steps.ios_signing.outputs.enabled == 'true'
        run: node scripts/verify-artifacts.mjs glob "apps/mobile/build/ios/ipa/*.ipa"
      - name: Upload signed iOS IPA
        if: steps.ios_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-ios-release-ipa
          path: apps/mobile/build/ios/ipa/*.ipa
      - name: Preserve iOS Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: fluxdown-ios-symbols
          path: apps/mobile/build/symbols/ios
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: ${{ inputs.run_mode == 'release' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs:
      - rust
      - desktop
      - android
      - ios
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/github-release/raw
      - name: Prepare release assets
        run: node scripts/prepare-github-release-assets.mjs dist/github-release/raw dist/github-release/assets
      - name: Verify public assets and checksums
        run: npm run verify:github-release
      - name: Verify release tag version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/github-release/assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "FluxDown ${GITHUB_REF_NAME#v}" \
              --notes-file dist/github-release/RELEASE_NOTES.md \
              --draft=false \
              --prerelease=false
          else
            gh release create "$GITHUB_REF_NAME" dist/github-release/assets/* \
              --title "FluxDown ${GITHUB_REF_NAME#v}" \
              --notes-file dist/github-release/RELEASE_NOTES.md \
              --verify-tag
          fi
