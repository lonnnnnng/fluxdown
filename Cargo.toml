[workspace]
members = [
    "crates/fluxdown-core",
    "crates/fluxdown-ffi",
    "crates/fluxdown-cli",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "1.0.21"

# 作者: long
# 保留吞吐优先的优化等级和 panic 展开行为，避免为了减包改变 FFI 错误恢复；链接阶段合并重复代码。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# 作者: long
# CLI 和桌面不通过内部 Rust 符号名动态调用，额外去除符号表；移动 FFI 保留其导出符号供 Dart 查找。
[profile.release.package.fluxdown-cli]
strip = "symbols"

[profile.release.package.fluxdown-desktop]
strip = "symbols"

[workspace.dependencies]
aes = "0.8.4"
anyhow = "1.0.100"
cbc = { version = "0.1.2", features = ["alloc"] }
clap = { version = "4.5.53", features = ["derive"] }
futures-util = "0.3.31"
librqbit-bencode = { version = "3.1", default-features = false, features = ["sha1-ring"] }
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls"] }
m3u8-rs = "6.0.0"
open = "5.3.5"
percent-encoding = "2.3.2"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
smb2 = "0.11.2"
ssh2 = "0.9.5"
suppaftp = { version = "11.0.0", features = ["tokio", "tokio-rustls-ring", "deprecated"] }
tauri = { version = "2.9.5", features = ["tray-icon"] }
tauri-build = "2.5.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-notification = "2.3.0"
tauri-plugin-single-instance = "2.3.0"
tauri-plugin-window-state = "2.4.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
webpki-roots = "1.0.7"
tempfile = "3.23.0"
